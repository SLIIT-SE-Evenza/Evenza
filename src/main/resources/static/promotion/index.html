<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Evenza Promotions</title><link rel="stylesheet" href="/assets/module.css"></head><body class="brown"><div class="shell"><aside class="side"><div class="brand">evenza<small>Campaign studio</small></div><nav class="nav"><a href="/">Overview</a><a href="/events/index.html">Events</a><a href="/booking/index.html">Bookings</a><a href="/schedule/index.html">Schedule</a><a href="/inquiry/index.html">Inquiry</a><a class="active">Promotions</a></nav></aside><main class="content"><header class="top"><div><div class="eyebrow">PROMOTION MANAGEMENT</div><h1>Offer campaign studio</h1><p>Build time-limited offers and manage their publication lifecycle.</p></div><button class="btn secondary" id="sampleBtn">Create sample offer</button></header><section class="hero"><div><h2>Packages customers notice</h2><p></p></div><button class="btn ghost" id="newBtn">+ New promotion</button></section><div class="stats"><div class="stat"><strong id="total">0</strong>Total offers</div><div class="stat"><strong id="active">0</strong>Active</div><div class="stat"><strong id="draft">0</strong>Drafts</div><div class="stat"><strong id="scheduled">0</strong>Scheduled</div></div><div class="grid"><section class="card span-5"><h3 id="formTitle">Create promotion</h3><form id="form"><input id="id" type="hidden"><input id="version" type="hidden"><div class="form-grid"><div class="full"><label>Campaign title</label><input id="title" required maxlength="150"></div><div><label>Package name</label><input id="packageName" required></div><div><label>Category</label><input id="category" required placeholder="Photography"></div><div><label>Original price (LKR)</label><input id="price" type="number" min="1" step=".01" required></div><div><label>Discount type</label><select id="discountType"><option>PERCENTAGE</option><option>FIXED_AMOUNT</option></select></div><div><label>Discount value</label><input id="discount" type="number" min=".01" step=".01" required></div><div></div><div><label>Starts</label><input id="startsAt" type="datetime-local" required></div><div><label>Ends</label><input id="endsAt" type="datetime-local" required></div><div class="full"><label>Description</label><textarea id="description" required></textarea></div><div class="full"><label>Terms</label><textarea id="terms" required></textarea></div></div><div class="actions"><button class="btn">Save draft</button><button class="btn secondary" type="button" id="clearBtn">Clear</button></div></form></section><section class="card span-7"><h3>Campaign portfolio</h3><div id="cards"></div></section></div></main></div><div class="toast"></div><script src="/assets/common.js"></script><script src="/promotion/promotion.js"></script></body></html>
